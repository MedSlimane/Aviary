<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Aviary</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#090a0d" />
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/main.css" />
  </head>

  <body class="font-sans antialiased">
    <main class="flex min-h-[100dvh] items-center px-6 py-16 lg:px-10">
      <div class="mx-auto w-full max-w-[1400px]">
        <a href="/" class="inline-flex items-center gap-2.5">
          <img src="/assets/mark.svg" alt="" class="h-7 w-7" />
          <span class="text-[17px] font-semibold tracking-tight">Aviary</span>
        </a>

        <div class="mt-20 max-w-[42rem]">
          <p class="font-mono text-[12px] uppercase tracking-[0.18em] text-violet">
            404 · Not found
          </p>
          <h1 class="mt-5 text-4xl font-medium leading-[1.06] tracking-[-0.03em] md:text-[56px]">
            This page isn't in the library.
          </h1>
          <p class="mt-6 max-w-[32rem] text-[15px] leading-relaxed text-ink-2">
            The address may have moved, or it may never have existed. The Aviary
            home page is still right where you left it.
          </p>
          <a
            href="/"
            class="mt-9 inline-flex rounded-full bg-ink px-6 py-3 text-sm font-semibold text-canvas transition-transform hover:-translate-y-px active:translate-y-0"
          >
            Return home
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
