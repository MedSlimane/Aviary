    <path d="M64,59C58.9,54.3 57.4,46.5 60.2,34.3L64,14C67.8,29.2 70.2,43.2 68.7,49.5C67.8,53.7 66.1,57 64,59ZM68.33,61.5C69.85,54.73 75.86,49.53 87.82,45.86L107.3,39C96.04,49.89 85.11,58.97 78.91,60.82C74.82,62.14 71.11,62.32 68.33,61.5ZM68.33,66.5C74.95,64.43 82.46,67.03 91.62,75.56L107.3,89C92.24,84.69 78.91,79.77 74.21,75.32C71.02,72.44 69.01,69.32 68.33,66.5ZM64,69C69.1,73.7 70.6,81.5 67.8,93.7L64,114C60.2,98.8 57.8,84.8 59.3,78.5C60.2,74.3 61.9,71 64,69ZM59.67,66.5C58.15,73.27 52.14,78.47 40.18,82.14L20.7,89C31.96,78.11 42.89,69.03 49.09,67.18C53.18,65.86 56.89,65.68 59.67,66.5ZM59.67,61.5C53.05,63.57 45.54,60.97 36.38,52.44L20.7,39C35.76,43.31 49.09,48.23 53.79,52.68C56.98,55.56 58.99,58.68 59.67,61.5Z"/>
    <circle cx="64" cy="64" r="7.2"/>
