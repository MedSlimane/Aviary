<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Fine monochrome film grain</title>
  <desc id="desc">A seamless transparent fine-grain overlay at approximately four percent opacity.</desc>
  <defs>
    <filter id="fine" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".92" numOctaves="4" seed="103" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="contrast">
        <feFuncR type="linear" slope="1.9" intercept="-.45"/>
        <feFuncG type="linear" slope="1.9" intercept="-.45"/>
        <feFuncB type="linear" slope="1.9" intercept="-.45"/>
        <feFuncA type="table" tableValues="0 .04"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#FFFFFF" filter="url(#fine)"/>
</svg>
