<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Desaturated ambient mesh background</title>
  <desc id="desc">A restrained indigo, slate, teal, mauve, and warm-gray mesh for near-black window backgrounds.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11121A"/>
      <stop offset=".45" stop-color="#171923"/>
      <stop offset="1" stop-color="#12151B"/>
    </linearGradient>
    <radialGradient id="slate"><stop stop-color="#5C6580" stop-opacity=".56"/><stop offset=".5" stop-color="#343B52" stop-opacity=".28"/><stop offset="1" stop-color="#1B1E2B" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#786B8F" stop-opacity=".46"/><stop offset=".48" stop-color="#4A405E" stop-opacity=".25"/><stop offset="1" stop-color="#261F34" stop-opacity="0"/></radialGradient>
    <radialGradient id="teal"><stop stop-color="#607F7D" stop-opacity=".42"/><stop offset=".5" stop-color="#365654" stop-opacity=".24"/><stop offset="1" stop-color="#1C3031" stop-opacity="0"/></radialGradient>
    <radialGradient id="mauve"><stop stop-color="#896B78" stop-opacity=".38"/><stop offset=".5" stop-color="#5B414D" stop-opacity=".21"/><stop offset="1" stop-color="#302128" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm"><stop stop-color="#A49880" stop-opacity=".34"/><stop offset=".48" stop-color="#615C50" stop-opacity=".18"/><stop offset="1" stop-color="#292820" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#586D88" stop-opacity=".4"/><stop offset=".5" stop-color="#34465E" stop-opacity=".2"/><stop offset="1" stop-color="#1B2938" stop-opacity="0"/></radialGradient>
    <filter id="b170" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="170"/></filter>
    <filter id="b105" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="105"/></filter>
    <filter id="texture">
      <feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="4" seed="89" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values=".6 0 0 0 .1 0 .65 0 0 .09 0 0 .72 0 .08 0 0 0 .075 0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="soft-light"/>
    </filter>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#05060A" stop-opacity=".18"/><stop offset=".45" stop-color="#05060A" stop-opacity="0"/><stop offset="1" stop-color="#05060A" stop-opacity=".3"/></linearGradient>
  </defs>
  <g filter="url(#texture)">
    <rect width="1200" height="800" fill="url(#base)"/>
    <ellipse cx="150" cy="80" rx="520" ry="430" fill="url(#slate)" filter="url(#b170)" style="mix-blend-mode:screen"/>
    <ellipse cx="600" cy="30" rx="450" ry="340" fill="url(#violet)" filter="url(#b105)" style="mix-blend-mode:screen"/>
    <ellipse cx="1080" cy="190" rx="450" ry="420" fill="url(#teal)" filter="url(#b170)" style="mix-blend-mode:screen"/>
    <ellipse cx="180" cy="730" rx="510" ry="390" fill="url(#blue)" filter="url(#b105)" style="mix-blend-mode:screen"/>
    <ellipse cx="670" cy="760" rx="500" ry="350" fill="url(#mauve)" filter="url(#b170)" style="mix-blend-mode:screen"/>
    <ellipse cx="1130" cy="720" rx="410" ry="330" fill="url(#warm)" filter="url(#b105)" style="mix-blend-mode:screen"/>
    <ellipse cx="590" cy="395" rx="380" ry="280" fill="#BAC4CF" opacity=".06" filter="url(#b105)" style="mix-blend-mode:screen"/>
  </g>
  <rect width="1200" height="800" fill="url(#vignette)"/>
</svg>
